# Applies apps/web/supabase/seed_prices.sql (an idempotent upsert generated by apps/web/scripts/seed-prices.mjs)
# to the live Supabase database through the Management API whenever it changes on main.
#
# Repo secrets (Settings → Secrets and variables → Actions), see docs/LAUNCH.md:
#   SUPABASE_ACCESS_TOKEN  personal access token from https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   iitzmnrocuepimnhbkth
name: pricing-apply

on:
  push:
    branches: [main]
    paths:
      - apps/web/supabase/seed_prices.sql
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricing-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Apply seed_prices.sql to the live database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "::error title=Missing secrets::Add SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF as repo secrets (docs/LAUNCH.md)."
            exit 1
          fi
          api="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query"
          # The token goes only into a curl config file (never argv or the log), which is deleted on exit.
          auth="$RUNNER_TEMP/auth.curl"
          trap 'rm -f "$auth"' EXIT
          umask 077
          printf 'header = "Authorization: Bearer %s"\n' "$SUPABASE_ACCESS_TOKEN" > "$auth"

          query() { # $1 = JSON body file, $2 = response file; prints the HTTP status
            curl -sS --retry 2 --max-time 120 -o "$2" -w '%{http_code}' -X POST "$api" \
              -K "$auth" -H 'Content-Type: application/json' --data-binary @"$1"
          }

          jq -n --rawfile q apps/web/supabase/seed_prices.sql '{query: $q}' > "$RUNNER_TEMP/seed.json"
          status=$(query "$RUNNER_TEMP/seed.json" "$RUNNER_TEMP/seed.out")
          echo "seed_prices.sql → HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error title=Supabase rejected seed_prices.sql::HTTP $status"
            head -c 2000 "$RUNNER_TEMP/seed.out"; echo
            exit 1
          fi

          expected=$(grep -oE 'pricing snapshot [0-9]{4}-[0-9]{2}-[0-9]{2}' apps/web/supabase/seed_prices.sql | head -1 | cut -d' ' -f3)
          jq -n --arg d "$expected" '{query: ("select count(*)::int as total, count(*) filter (where snapshot_date = date '\''" + $d + "'\'')::int as at_snapshot, max(snapshot_date)::text as latest from public.model_prices")}' > "$RUNNER_TEMP/verify.json"
          status=$(query "$RUNNER_TEMP/verify.json" "$RUNNER_TEMP/verify.out")
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error title=Verification query failed::HTTP $status"
            head -c 2000 "$RUNNER_TEMP/verify.out"; echo
            exit 1
          fi
          echo "model_prices after apply: $(cat "$RUNNER_TEMP/verify.out")"
          {
            echo "### model_prices applied"
            echo
            echo "Snapshot $expected · $(jq -r '.[0] | "\(.total) rows, \(.at_snapshot) at this snapshot, latest \(.latest)"' "$RUNNER_TEMP/verify.out")"
          } >> "$GITHUB_STEP_SUMMARY"
