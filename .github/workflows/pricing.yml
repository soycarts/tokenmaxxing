# Daily API price refresh. Re-fetches the LiteLLM + models.dev snapshots the CLI bundles, regenerates
# apps/web/supabase/seed_prices.sql, and opens (or updates) one PR on `pricing/auto` whose body is the
# pricing-diff.mjs table. Merging it ships the prices to the CLI and, via pricing-apply.yml, to the live DB.
# See docs/PRICING.md.
name: pricing

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: pricing-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh snapshots and seed SQL
        run: npm run pricing:refresh

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Pricing snapshots are up to date; no PR." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Price diff
        if: steps.diff.outputs.changed == 'true'
        run: |
          node packages/cli/scripts/pricing-diff.mjs > "$RUNNER_TEMP/pricing-diff.md"
          cat "$RUNNER_TEMP/pricing-diff.md" >> "$GITHUB_STEP_SUMMARY"

      # Tests run against the refreshed snapshots. A failure does not stop the PR: it is reported in the
      # PR body, as a `pricing / tests` commit status on the PR head, and by failing this run at the end.
      - name: Test packages/cli
        id: test_cli
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: npm test --workspace packages/cli

      - name: Test apps/web
        id: test_web
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        run: npm test --workspace apps/web

      - name: PR body
        if: steps.diff.outputs.changed == 'true'
        env:
          CLI: ${{ steps.test_cli.outcome }}
          WEB: ${{ steps.test_web.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            cat "$RUNNER_TEMP/pricing-diff.md"
            echo
            echo "---"
            echo "Tests on the refreshed snapshots: packages/cli **$CLI**, apps/web **$WEB** ([run]($RUN_URL))."
            echo
            echo "Generated by \`.github/workflows/pricing.yml\` from LiteLLM and models.dev. Review against the vendor pricing pages (docs/PRICING.md, research checklist) before merging; merging applies \`seed_prices.sql\` to the live DB."
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open or update the pricing PR
        id: pr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # Optional PAT so ci.yml runs on the PR (PRs opened with GITHUB_TOKEN do not trigger workflows).
          token: ${{ secrets.PRICING_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: pricing/auto
          delete-branch: true
          title: 'pricing: snapshot ${{ steps.diff.outputs.date }}'
          commit-message: |
            cli: pricing snapshot ${{ steps.diff.outputs.date }}

            Automated refresh from LiteLLM and models.dev by .github/workflows/pricing.yml.
          body-path: ${{ runner.temp }}/pr-body.md
          add-paths: |
            packages/cli/src/pricing/litellm.snapshot.json
            packages/cli/src/pricing/modelsdev.snapshot.json
            packages/cli/src/pricing/index.ts
            apps/web/supabase/seed_prices.sql

      - name: Report test result on the PR head
        if: steps.pr.outputs.pull-request-head-sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.pr.outputs.pull-request-head-sha }}
          OK: ${{ steps.test_cli.outcome == 'success' && steps.test_web.outcome == 'success' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OK" = "true" ]; then state=success; desc="cli and web tests pass on the refreshed snapshots"; else state=failure; desc="tests fail on the refreshed snapshots"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="pricing / tests" -f description="$desc" -f target_url="$RUN_URL" > /dev/null

      - name: Fail the run when tests failed
        if: steps.test_cli.outcome == 'failure' || steps.test_web.outcome == 'failure'
        run: |
          echo "::error title=Pricing refresh breaks tests::See the Test steps above; the PR was still opened so the diff can be reviewed."
          exit 1
